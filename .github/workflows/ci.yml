name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint

  typecheck:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  unit-tests:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:unit

  integration-tests:
    needs: install
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shp
          POSTGRES_PASSWORD: shp_ci_password
          POSTGRES_DB: shp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shp -d shp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A dedicated, disposable database — never development or production.
      DATABASE_URL: postgresql://shp:shp_ci_password@localhost:5432/shp_test
      TEST_DATABASE_URL: postgresql://shp:shp_ci_password@localhost:5432/shp_test
      AUTH_SECRET: ci-only-secret-value-that-is-long-enough-for-validation-000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:integration

  security-audit:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      # High/critical only — informational for lower severities, does not
      # block the pipeline on transitive dev-dependency noise.
      - run: npm audit --audit-level=high || true

  build:
    needs: [lint, typecheck, unit-tests, integration-tests]
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://build:build@localhost:5432/build
      AUTH_SECRET: build-only-secret-value-that-is-long-enough-for-validation-0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  e2e-tests:
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shp
          POSTGRES_PASSWORD: shp_e2e_password
          POSTGRES_DB: shp_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shp -d shp_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://shp:shp_e2e_password@localhost:5432/shp_e2e
      AUTH_SECRET: e2e-only-secret-value-that-is-long-enough-for-validation-00
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: ADMIN_EMAIL=e2e@shpsolutions.test ADMIN_PASSWORD=E2eTestPass123 npm run bootstrap:admin
      - run: npm run build
      - run: npm run start &
      - name: Wait for the app to become ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/ready > /dev/null; then
              echo "App is ready"; exit 0
            fi
            sleep 1
          done
          echo "App did not become ready in time" >&2; exit 1
      - run: npm run test:e2e
